global
    maxconn 256
    # Admin socket for the controller: "disable server" and "enable server".
    # The process listens on all container interfaces. Compose publishes it
    # only on the host's 127.0.0.1, so it is not open to the LAN.
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    # If A refuses the connection, try B in the same client request.
    option redispatch
    retries 2

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    timeout resolve 1s
    hold valid 1s
    hold nx 1s
    hold refused 1s
    hold timeout 1s
    hold other 1s

frontend minio_in
    bind *:80
    default_backend minio_api

backend minio_api
    # Active check: GET /minio/health/live must return 200.
    option httpchk
    http-check send meth GET uri /minio/health/live ver HTTP/1.1 hdr Host minio
    http-check expect status 200
    default-server inter 1s fall 2 rise 2
    # init-addr none: still start if Docker has no address for a stopped region.
    server minio-a minio-a:9000 check resolvers docker init-addr last,libc,none resolve-prefer ipv4
    server minio-b minio-b:9000 check backup resolvers docker init-addr last,libc,none resolve-prefer ipv4
